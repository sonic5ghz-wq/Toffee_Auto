name: Auto Update Toffee M3U

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch:       # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run playlist generator
        run: python update_playlist.py

      - name: Commit and push updated M3U
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add toffee_auto.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update M3U playlist" && git push)
          
